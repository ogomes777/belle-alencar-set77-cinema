name: Belle V86 - restore original campaign banners once
on:
  push:
    branches:
      - feat/belle-v86-opening-banners-cuberoll-signature
    paths:
      - .github/workflows/belle-v86-restore-banners-once.yml
permissions:
  contents: write
jobs:
  restore-two-user-banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original 16:9 user ZIP and verify full binary images
        shell: bash
        env:
          BANNERS_ZIP_URL: https://at.adobe.com/90jqbDqgRnsbnYv5
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 180 "$BANNERS_ZIP_URL" -o "$RUNNER_TEMP/belle-v86.zip"
          python3 - <<'PY'
          import zipfile, pathlib, hashlib
          import os
          archive=zipfile.ZipFile(os.path.join(os.environ["RUNNER_TEMP"],"belle-v86.zip"))
          dest=pathlib.Path("public/media")
          dest.mkdir(parents=True,exist_ok=True)
          expected={
            "banner-v86-vinho.png":("2176f21870669ee188d528213b052330311037fa3b557b01016688e60fd7b71e",2601293),
            "banner-v86-travertino.png":("8762e6f1845987602975404d6c6ae005d8588daeedef4f714f7c5604f1e7f8ba",2389835),
          }
          files=[f for f in archive.namelist() if f.lower().endswith(".png")]
          assert len(files)==2,(len(files),files)
          for name in files:
            target="banner-v86-vinho.png" if name.startswith("Assinatura") else "banner-v86-travertino.png"
            data=archive.read(name)
            digest=hashlib.sha256(data).hexdigest()
            assert (digest,len(data))==expected[target],(target,digest,len(data))
            (dest/target).write_bytes(data)
            print("Verified intact",target,len(data),digest)
          PY
      - name: Create responsive WebP equivalents from verified originals
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/belle-v86-sharp" sharp@0.34.5 --no-audit --no-fund
          SHARP_ROOT="$RUNNER_TEMP/belle-v86-sharp/node_modules" node - <<'JS'
          const sharp=require(process.env.SHARP_ROOT+'/sharp');
          const fs=require('node:fs');
          (async()=>{
            for(const name of ['vinho','travertino']){
              const source='public/media/banner-v86-'+name+'.png';
              const target='public/media/banner-v86-'+name+'.webp';
              const metadata=await sharp(source).metadata();
              if(metadata.width!==1672 || metadata.height!==941)throw new Error('Bad source dimensions '+name);
              const result=await sharp(source).webp({quality:91,effort:6}).toFile(target);
              if(result.width!==1672 || result.height!==941 || result.size<150000)throw new Error('Invalid webp '+name);
              console.log('Verified full WebP',name,result.size);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit complete banners (replace prior truncated placeholder blobs)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/banner-v86-vinho.png public/media/banner-v86-travertino.png public/media/banner-v86-vinho.webp public/media/banner-v86-travertino.webp
          git commit -m "fix(v86): restore 2 verified original PNG banners plus full responsive WebP"
          git push origin HEAD:feat/belle-v86-opening-banners-cuberoll-signature
