name: V79 - sync Originkit motion dependency lockfile (one-time)
on:
  push:
    branches:
      - feat/belle-v79-originkit-spin-phones
    paths:
      - .github/workflows/belle-v79-lock-once.yml
permissions:
  contents: write
jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Lock the exact transitive dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible package-lock.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(v79): lock Originkit motion dependency graph"
          git push origin HEAD:feat/belle-v79-originkit-spin-phones
