name: BELLE V58 | Evidências POV + 6 ângulos
on:
  push:
    branches:
      - feat/belle-pov-v58-set77
  workflow_dispatch:
  pull_request:
    branches:
      - claude/wonderful-meitner-kt2rnw
permissions:
  contents: read
jobs:
  six-scenes-pov:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript and 86+ unit tests
        run: |
          npm run typecheck
          npm test
      - name: Production-like build
        run: npm run build
      - name: Install isolated Chromium for evidence
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Run local production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/belle-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/belle-preview.log
          exit 1
      - name: Capture visit video, six angles and essential/mobile regression
        run: node tests/e2e/belle-v58-gallery.mjs
      - name: Store reproducible screenshots, comparator and walk video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BELLE-V58-POV-SIX-ANGLES-VIDEO
          path: artifacts/belle-pov-v58/
          if-no-files-found: warn
          retention-days: 30
