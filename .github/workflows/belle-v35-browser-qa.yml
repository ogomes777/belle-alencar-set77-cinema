name: Belle V35 | 22 micro-intros browser QA
on:
  push:
    branches:
      - feat/belle-v35-twenty-two-couture-reveals
  pull_request:
    branches:
      - fix/belle-v34-transition-integrity
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright@1.58.0 install --with-deps chromium
      - run: npm run test
      - run: npm run build
      - name: Start preview and exercise all scroll motifs
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/belle-v35.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/e2e/couture-v35.mjs
