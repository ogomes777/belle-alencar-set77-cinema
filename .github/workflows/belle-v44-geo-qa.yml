name: Belle V44 | Six Cities and Globe QA
on:
  push:
    branches:
      - feat/belle-v44-six-city-geo-globe
  pull_request:
    branches:
      - claude/wonderful-meitner-kt2rnw
permissions:
  contents: read
jobs:
  geo-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit regressions
        run: npm test
      - name: Complete four-language source
        run: node scripts/i18n-audit-v39.mjs
      - name: Production build
        run: npm run build
      - name: Browser dependencies
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Real globe, geography, map and viewport QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/belle-v44.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/e2e/belle-v44-six-city-globe.mjs
      - name: Real browser captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: belle-v44-geo-city-and-map-screenshots
          path: artifacts/belle-v44/*.png
          retention-days: 7
          if-no-files-found: ignore
