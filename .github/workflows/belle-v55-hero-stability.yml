name: Belle V55 | Continuous Hero Scrub and Copy Stability
on:
  push:
    branches:
      - fix/belle-v55-film-scrub-stability
      - claude/wonderful-meitner-kt2rnw
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Film interpolation and existing unit tests
        run: npm test
      - name: Production TypeScript and asset build
        run: npm run build
      - name: Chromium for mobile and desktop regression
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Boot preview and run stable hero/globe QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/belle-v55.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/e2e/belle-v55-hero-stability.mjs
      - name: Existing compact glass reverse-scroll regression
        run: node tests/e2e/belle-v49-film-compact-glass.mjs
