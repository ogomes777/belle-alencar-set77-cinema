name: Belle · QA da passarela
on:
  push:
    branches:
      - claude/bold-dijkstra-jyzqak
      - feat/belle-calligraphy-intro
      - feat/belle-motion-storytelling-v8
      - fix/belle-ticker-runway-flush
      - feat/belle-occasions-round-carousel-v9
      - feat/belle-occasions-living-portraits-v10
      - fix/belle-orbit-resilience-v11
      - fix/belle-portrait-alpha-v12
      - feat/belle-collection-scroll-cinema-v13
      - feat/belle-adaptive-glass-header-v14
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Preparar Chromium de testes
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar passarela na experiência renderizada
        run: |
          npm run preview > /tmp/belle-preview.log 2>&1 &
          node -e "let n=0;const t=setInterval(async()=>{try{const r=await fetch('http://127.0.0.1:4173');if(r.ok){clearInterval(t);process.exit(0)}}catch{}if(++n>45){clearInterval(t);process.exit(1)}},500)"
          node tests/e2e/occasions-round.mjs
          node tests/e2e/occasions-orbit-stability.mjs
          node tests/e2e/runway.mjs
          node tests/e2e/intro-calligraphy.mjs
          node tests/e2e/motion-director.mjs
          node tests/e2e/collection-scroll.mjs
          node tests/e2e/header-glass.mjs
